name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore (if present in Secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
          echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Release & Debug APKs with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Copy & Calculate SHA-256 Checksum
        run: |
          mkdir -p build-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/our-puthia-release.apk
            sha256sum build-output/our-puthia-release.apk > build-output/our-puthia-release.apk.sha256
          fi
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/our-puthia-debug.apk
            sha256sum build-output/our-puthia-debug.apk > build-output/our-puthia-debug.apk.sha256
          fi
          echo "--- BUILD OUTPUT SHA-256 ---"
          cat build-output/*.sha256 || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Our-Puthia-App-APK
          path: build-output/*
          retention-days: 30

      - name: Create GitHub Release (On Tags or Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
