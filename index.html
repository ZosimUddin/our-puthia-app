    <script>
      (function() {
        function isFsAssert(err) {
          if (!err) return false;
          var s = '';
          try {
            if (typeof err === 'string') s = err;
            else if (err.message) s = String(err.message) + ' ' + String(err.stack || '');
            else if (err.reason) s = String(err.reason.message || err.reason) + ' ' + String(err.reason.stack || '');
            else if (err.stack) s = String(err.stack);
            else s = String(err);
          } catch (_) {
            s = String(err);
          }
          return s.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
                 s.indexOf('ca9') !== -1 ||
                 s.indexOf('b815') !== -1 ||
                 s.indexOf('WatchChangeAggregator') !== -1 ||
                 s.indexOf('TargetState') !== -1 ||
                 s.indexOf('Unexpected state') !== -1;
        }
        var prevOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isFsAssert(msg) || isFsAssert(err)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
        window.addEventListener('error', function(e) {
          if (isFsAssert(e.error) || isFsAssert(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isFsAssert(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
